wandb: True

log_cov_stats: False
use_tensor_bias: False
use_channel_gains: False
use_cholesky_sigma: False
use_sigma_axis_floor: False
sigma_scale_sp: 1.0
sigma_floor: 0.0001
norm_mode: total

write_stage_timing_csv: True
stage_timing_splits: ["val", "test"]

# ROTATIONS
rotate_train: True
rotate_val: False
rotate_test: False
rotate_train_center: "origin"   # or "cop", "com"
rotate_eval_center: "origin"
# deterministic val/test rotations are better for reviewer-facing experiments
rotate_eval_deterministic: False

pw_grid: [128, 128, 128] # just for initializing the fft grid
pw_norm: backward
signed_weights: tanh_softplus

fft_set_dc_to_electrons: False
train_sample_frac: 0
val_sample_frac: 0
test_sample_frac: 0

data_split: ECD
debug: False

electra_type: single
# New stuff
plot_gaus_pos: True
backbone: escaip
escaip_cfg_path: "/ELECTRAFI/model/escaip/escaip_config.yaml"

project_name: ELECTRAFI_CUBIC
save_memory: False
#max_time: '00:00:05:00'
#max_time: '13:12:00:00'
#max_time: '00:48:00:00'
#max_time: '06:20:00:00'
max_time: '27:00:00:00'
max_epochs: 1000

crystal: True
pbc: True
wrap: True
weight_decay: 0.00

loss_type: "normal"
cutoff: 10
master_units: 1440
initial_lr: 0.0001
final_lr: 0.0001
clip_grad: False
gradient_clip_value: 0.5
negative_contributions: True
gaus_per_electrons: 80
lr_dec_every: 1
lr_gamma: 0.99
dens_path: /CUBIC_DATA

precision: float

relu: False
seed: 505
hpc: True

data_split_path: /ELECTRAFI/data_splits/

hpc_base_path: /ELECTRAFI/
pred_dens_path_val: pred_dens/validation/
density_delta_path_val: density_deltas/validation
pred_dens_path_test: pred_dens/test/
density_delta_path_test: density_deltas/test
gaus_pos_path_val: gaussian_positions/validation/
gaus_pos_path_test: gaussian_positions/test/
gaus_pos_outlier_path: outliers/
visualize_every: 250
model_dir: /ELECTRAFI/trained_models

ood_eval: False
ood_names: ["gnome_ecd"]
ood_paths: ["/gnome_ecd"]

load_model: False
load_model_path: /ELECTRAFI/trained_models/ELECTRAFI_BEST.model_state_dict


# TRAINING
optimizer: muon_mix
amsgrad: True
fused: False
n_epochs: 1000
eval_every: 1
construct_test_cd: True
construct_val_cd: True
save_model: True
